<article
  class="film-card"
  role="button"
  tabindex="0"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
>
  <div class="film-card__poster-wrapper">
    <img
      class="film-card__poster"
      [src]="film().posterUrl"
      [alt]="film().title"
    />
  </div>

  <div class="film-card__content">
    <div class="film-card__info">
      <div class="film-card__header">
        <h2 class="film-card__title">
          {{ film().title }}
        </h2>

        <span class="film-card__rating">
          ★ {{ film().rating }}
        </span>
      </div>

      <p class="film-card__meta">
        {{ film().year }} · {{ film().genre }}
      </p>
    </div>

    <button
      type="button"
      class="film-card__button"
      [class.film-card__button--active]="film().isFavorite"
      (click)="onFavoriteClick($event)"
    >
      {{ film().isFavorite ? 'In favorites' : 'Add to favorites' }}
    </button>
  </div>
</article>
